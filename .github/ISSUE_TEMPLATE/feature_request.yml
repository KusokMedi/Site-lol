name: Feature request
description: Suggest an improvement for the site
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What do you want to add or change?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why is this useful?
      description: Explain the benefit.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked that the suggestion is not already tracked.
          required: true
